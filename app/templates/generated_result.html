<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Результат генерации</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .content-box {
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0px 0px 10px rgba(0, 0, 0, 0.1);
        }
    </style>
</head>
<body class="bg-light">
    <div class="container mt-5">
        <h2 class="text-center">Результат генерации</h2>

        <div class="row mt-4">
            <!-- Левая колонка: текст -->
            <div class="col-md-6">
                <div class="content-box p-3">
                    <h4>Сгенерированный пост:</h4>
                    <p id="postContent">{{ post_content }}</p>
                    <button class="btn btn-warning float-end mt-2" onclick="regenerateText()">Изменить текст</button>
                </div>
            </div>

            <!-- Правая колонка: изображение -->
            <div class="col-md-6">
                {% if image_url %}
                    <div class="content-box text-center">
                        <h4>Сгенерированное изображение:</h4>
                        <img id="postImage" src="{{ image_url }}" alt="Сгенерированное изображение"
                             class="img-fluid rounded shadow" style="max-width: 100%;">
                        <button class="btn btn-warning mt-2 float-end" onclick="regenerateImage()">Заменить изображение</button>
                    </div>
                {% endif %}
            </div>
        </div>

        {% if post_content %}
            <div class="mt-3 text-center">
                <button class="btn btn-primary w-100" onclick="publishToVK()">Публикация в VK</button>
            </div>
        {% endif %}

        <div class="text-center mt-4">
            <a href="{{ url_for('smm.dashboard') }}" class="btn btn-secondary">Назад в панель</a>
            <a href="{{ url_for('smm.post_generator') }}" class="btn btn-dark">Новая генерация</a>
        </div>
    </div>

    <!-- Скрипты для обновления -->
    <script>
        function regenerateText() {
            fetch("{{ url_for('smm.regenerate_text') }}", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ tone: "{{ form.tone.data }}", topic: "{{ form.topic.data }}" })
            })
            .then(response => response.json())
            .then(data => {
                document.getElementById("postContent").innerText = data.new_text;
            });
        }

        function regenerateImage() {
            fetch("{{ url_for('smm.regenerate_image') }}", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ topic: "{{ form.topic.data }}" })
            })
            .then(response => response.json())
            .then(data => {
                document.getElementById("postImage").src = data.new_image_url;
            });
        }

        function publishToVK() {
            let postText = document.getElementById("postContent").innerText;
            let imageUrl = document.getElementById("postImage") ? document.getElementById("postImage").src : null;

            fetch("{{ url_for('smm.publish_to_vk') }}", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ content: postText, image_url: imageUrl })
            })
            .then(response => response.json())
            .then(data => {
                if (data.error) {
                    alert("Ошибка публикации: " + data.error);
                } else {
                    alert("Пост опубликован в VK!");
                }
            });
        }
    </script>
</body>
</html>
