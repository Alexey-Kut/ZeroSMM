<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Настройки</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-image: url("{{ url_for('static', filename='images/tulips.jpg') }}");
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
        }
        .container {
            background: rgba(255, 255, 255, 0.8);
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0px 0px 10px rgba(0, 0, 0, 0.2);
            max-width: 500px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2 class="mb-4">Настройки</h2>
        <form method="POST">
            <div class="mb-3">
                <label class="form-label">VK API ID:</label>
                <input type="text" name="vk_api_id" class="form-control" value="{{ user.vk_api_id }}">
            </div>
            <div class="mb-3">
                <label class="form-label">VK Group ID:</label>
                <input type="text" name="vk_group_id" class="form-control" value="{{ user.vk_group_id }}">
            </div>
            <button type="submit" class="btn btn-success w-100">Сохранить</button>
        </form>

        <div class="mt-3">
            <a href="{{ url_for('smm.dashboard') }}" class="btn btn-secondary">Назад в панель</a>
        </div>
    </div>
</body>
</html>
