<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Информационная панель</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-image: url("{{ url_for('static', filename='images/trout.jpg') }}");
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
        }
        .content-box {
            background: rgba(255, 255, 255, 0.8);
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0px 0px 10px rgba(0, 0, 0, 0.2);
        }
    </style>
</head>
<body>
    <div class="content-box">
        <h2 class="mb-3">Информационная панель</h2>
        <p>Добро пожаловать на вашу информационную панель!</p>

        <div class="d-flex justify-content-center gap-2">
            <a href="{{ url_for('smm.settings') }}" class="btn btn-primary">Настройки</a>
            <a href="{{ url_for('smm.post_generator') }}" class="btn btn-success">Генератор постов</a>
            <a href="{{ url_for('smm.vk_stats') }}" class="btn btn-info">VK Stats</a>
            <a href="{{ url_for('auth.logout') }}" class="btn btn-danger">Выход</a>
        </div>
    </div>
</body>
</html>
